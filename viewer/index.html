<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMG-JARVIS :: Empire Media Group</title>
<style>
  :root {
    --bg: #0A0A0F;
    --gold: #C9A84C;
    --cyan: #00E5FF;
    --emerald: #00C896;
    --panel-bg: rgba(10, 12, 18, 0.92);
    --border: rgba(201, 168, 76, 0.35);
    --text: #E8E8F0;
    --text-dim: #8A8AA0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    overflow: hidden;
  }
  #graph { position: fixed; inset: 0; z-index: 1; }

  /* ---------- Boot overlay ---------- */
  #boot-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: radial-gradient(ellipse at center, #101018 0%, #05050a 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.8s ease;
  }
  #boot-overlay.hidden { opacity: 0; pointer-events: none; }
  .boot-title {
    font-size: 2.6rem;
    letter-spacing: 0.6rem;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(201,168,76,0.6);
    margin-bottom: 0.5rem;
  }
  .boot-sub {
    color: var(--text-dim);
    letter-spacing: 0.2rem;
    font-size: 0.85rem;
    margin-bottom: 2.2rem;
    text-transform: uppercase;
  }
  .boot-bar-track {
    width: 420px;
    max-width: 80vw;
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    overflow: hidden;
    border: 1px solid rgba(201,168,76,0.25);
  }
  .boot-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--emerald), var(--gold));
    box-shadow: 0 0 12px rgba(201,168,76,0.8);
    transition: width 0.15s linear;
  }
  .boot-status {
    margin-top: 1rem;
    font-size: 0.75rem;
    color: var(--text-dim);
    letter-spacing: 0.1rem;
    min-height: 1.2em;
  }

  /* ---------- Status bar ---------- */
  #status-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 22px;
    background: linear-gradient(180deg, rgba(10,10,15,0.9) 0%, rgba(10,10,15,0) 100%);
    pointer-events: none;
  }
  #status-bar .brand {
    color: var(--gold);
    font-weight: 700;
    letter-spacing: 0.3rem;
    font-size: 0.95rem;
    pointer-events: auto;
  }
  #status-counts {
    display: flex;
    gap: 18px;
    font-size: 0.78rem;
    letter-spacing: 0.05rem;
    pointer-events: auto;
  }
  #status-counts span { display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.active { background: var(--emerald); box-shadow: 0 0 6px var(--emerald); }
  .dot.processing { background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }
  .dot.offline { background: #555; }

  /* ---------- Search ---------- */
  #search-wrap {
    position: fixed;
    top: 54px;
    left: 22px;
    z-index: 20;
  }
  #search-input {
    width: 260px;
    padding: 9px 14px;
    background: rgba(15,15,22,0.85);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text);
    font-size: 0.85rem;
    outline: none;
  }
  #search-input::placeholder { color: var(--text-dim); }
  #search-input:focus { border-color: var(--gold); box-shadow: 0 0 10px rgba(201,168,76,0.35); }

  /* ---------- Side panel ---------- */
  #side-panel {
    position: fixed;
    top: 0;
    right: -400px;
    width: 380px;
    height: 100%;
    z-index: 30;
    background: var(--panel-bg);
    border-left: 1px solid var(--border);
    backdrop-filter: blur(6px);
    transition: right 0.35s ease;
    padding: 26px 22px;
    overflow-y: auto;
  }
  #side-panel.open { right: 0; }
  #side-panel .close-btn {
    position: absolute;
    top: 16px;
    right: 18px;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 1.4rem;
    cursor: pointer;
  }
  #side-panel .close-btn:hover { color: var(--text); }
  #panel-group-tag {
    display: inline-block;
    font-size: 0.65rem;
    letter-spacing: 0.1rem;
    padding: 3px 10px;
    border-radius: 12px;
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  #panel-name {
    font-size: 1.5rem;
    font-weight: 700;
    margin: 0 0 4px 0;
  }
  #panel-type {
    color: var(--text-dim);
    font-size: 0.85rem;
    margin-bottom: 18px;
    text-transform: capitalize;
  }
  .panel-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    font-size: 0.85rem;
  }
  .panel-row .k { color: var(--text-dim); }
  #panel-description {
    margin: 16px 0;
    font-size: 0.9rem;
    line-height: 1.5;
    color: var(--text);
  }
  #panel-linked-title {
    font-size: 0.75rem;
    letter-spacing: 0.1rem;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 18px 0 8px 0;
  }
  #panel-linked-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  #panel-linked-list li {
    padding: 8px 10px;
    margin-bottom: 6px;
    border-radius: 8px;
    background: rgba(255,255,255,0.04);
    cursor: pointer;
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s ease;
  }
  #panel-linked-list li:hover { background: rgba(201,168,76,0.15); }

  /* ---------- Chat bar ---------- */
  #chat-answer {
    position: fixed;
    bottom: 92px;
    left: 50%;
    transform: translateX(-50%);
    max-width: 640px;
    width: 90%;
    z-index: 25;
    background: rgba(12,12,18,0.92);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 18px;
    font-size: 0.9rem;
    line-height: 1.5;
    color: var(--text);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    max-height: 30vh;
    overflow-y: auto;
  }
  #chat-answer.visible { opacity: 1; pointer-events: auto; }
  #chat-answer .label {
    color: var(--gold);
    font-size: 0.7rem;
    letter-spacing: 0.15rem;
    display: block;
    margin-bottom: 6px;
  }

  #chat-bar {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    width: 640px;
    max-width: 92vw;
    z-index: 25;
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(15,15,22,0.92);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 8px 10px 8px 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }
  #chat-input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 0.95rem;
  }
  #chat-input::placeholder { color: var(--text-dim); }
  .round-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.04);
    color: var(--text);
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }
  .round-btn:hover { background: rgba(201,168,76,0.2); }
  #mic-btn.listening {
    background: var(--cyan);
    color: #05050a;
    box-shadow: 0 0 14px var(--cyan);
  }
  #send-btn { background: var(--gold); color: #1a1400; border-color: var(--gold); }
  #send-btn:hover { background: #e0bc5c; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.4); border-radius: 3px; }
</style>
</head>
<body>

<div id="boot-overlay">
  <div class="boot-title">EMG&nbsp;&#183;&nbsp;JARVIS</div>
  <div class="boot-sub">Empire Media Group Agent Command System</div>
  <div class="boot-bar-track"><div class="boot-bar-fill" id="boot-bar-fill"></div></div>
  <div class="boot-status" id="boot-status">Initializing agent mesh&hellip;</div>
</div>

<div id="status-bar">
  <div class="brand">EMG&#183;JARVIS</div>
  <div id="status-counts">
    <span><i class="dot active"></i><span id="count-active">0</span> ACTIVE</span>
    <span><i class="dot processing"></i><span id="count-processing">0</span> PROCESSING</span>
    <span><i class="dot offline"></i><span id="count-offline">0</span> OFFLINE</span>
    <span id="count-total-wrap">&#183; <span id="count-total">0</span> AGENTS</span>
  </div>
</div>

<div id="search-wrap">
  <input id="search-input" type="text" placeholder="Search agents&hellip;" autocomplete="off">
</div>

<div id="graph"></div>

<div id="side-panel">
  <button class="close-btn" id="panel-close">&times;</button>
  <span id="panel-group-tag"></span>
  <h2 id="panel-name">&mdash;</h2>
  <div id="panel-type">&mdash;</div>
  <div class="panel-row"><span class="k">Status</span><span id="panel-status">&mdash;</span></div>
  <div class="panel-row"><span class="k">Tools</span><span id="panel-tools">&mdash;</span></div>
  <div id="panel-description"></div>
  <div id="panel-linked-title">Linked Agents</div>
  <ul id="panel-linked-list"></ul>
</div>

<div id="chat-answer"><span class="label">JARVIS</span><span id="chat-answer-text"></span></div>

<div id="chat-bar">
  <button class="round-btn" id="mic-btn" title="Voice input">&#127908;</button>
  <input id="chat-input" type="text" placeholder="Ask JARVIS, or type 'remember ...'" autocomplete="off">
  <button class="round-btn" id="send-btn" title="Send">&#10148;</button>
</div>

<script src="https://unpkg.com/3d-force-graph@1.73.4/dist/3d-force-graph.min.js"></script>
<script src="/graph-data.js"></script>
<script>
(function () {
  "use strict";

  /* ============================================================
     Session
     ============================================================ */
  function getSessionId() {
    var key = "emg-jarvis-session";
    var id = localStorage.getItem(key);
    if (!id) {
      id = "sess-" + Date.now() + "-" + Math.random().toString(36).slice(2, 10);
      localStorage.setItem(key, id);
    }
    return id;
  }
  var SESSION_ID = getSessionId();

  /* ============================================================
     Graph setup
     ============================================================ */
  var groupVal = { SUPER_AGENTS: 10, VOICE_AI: 6, CONVERSATION_AI: 3.5 };
  var highlighted = new Set();
  var baseColorOf = {};
  GRAPH.nodes.forEach(function (n) { baseColorOf[n.id] = n.color; });

  var Graph = ForceGraph3D()(document.getElementById("graph"))
    .graphData(GRAPH)
    .backgroundColor("#0A0A0F")
    .showNavInfo(false)
    .nodeLabel(function (n) { return n.label + " (" + n.group.replace("_", " ") + ")"; })
    .nodeColor(function (n) { return highlighted.has(n.id) ? "#FFFFFF" : n.color; })
    .nodeVal(function (n) { return groupVal[n.group] || 4; })
    .nodeOpacity(0.92)
    .linkColor(function () { return "rgba(180,190,220,0.18)"; })
    .linkOpacity(0.35)
    .linkWidth(0.4)
    .onNodeClick(function (node) { openAgent(node.id, true); });

  window.addEventListener("resize", function () {
    Graph.width(window.innerWidth).height(window.innerHeight);
  });

  function refreshColors() {
    Graph.nodeColor(Graph.nodeColor());
  }

  function flyToNode(node, ms) {
    if (!node) return;
    var distance = 130;
    var distRatio = 1 + distance / Math.hypot(node.x || 1, node.y || 1, node.z || 1);
    Graph.cameraPosition(
      { x: (node.x || 0) * distRatio, y: (node.y || 0) * distRatio, z: (node.z || 0) * distRatio },
      node,
      ms || 1000
    );
  }

  function nodeById(id) {
    return Graph.graphData().nodes.find(function (n) { return n.id === id; });
  }

  function lightUpCluster(ids, focusFirst) {
    highlighted = new Set(ids);
    refreshColors();
    if (focusFirst && ids.length) {
      var first = nodeById(ids[0]);
      flyToNode(first, 1200);
    }
    setTimeout(function () {
      highlighted = new Set();
      refreshColors();
    }, 4000);
  }

  /* ============================================================
     Status bar
     ============================================================ */
  function refreshStatus() {
    fetch("/status")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        document.getElementById("count-active").textContent = data.active || 0;
        document.getElementById("count-processing").textContent = data.processing || 0;
        document.getElementById("count-offline").textContent = data.offline || 0;
        document.getElementById("count-total").textContent = data.total || 0;
      })
      .catch(function () {
        var counts = { active: 0, processing: 0, offline: 0, total: GRAPH.nodes.length };
        GRAPH.nodes.forEach(function (n) { counts[n.status] = (counts[n.status] || 0) + 1; });
        document.getElementById("count-active").textContent = counts.active;
        document.getElementById("count-processing").textContent = counts.processing;
        document.getElementById("count-offline").textContent = counts.offline;
        document.getElementById("count-total").textContent = counts.total;
      });
  }
  refreshStatus();
  setInterval(refreshStatus, 15000);

  /* ============================================================
     Boot overlay + voice greeting
     ============================================================ */
  function timeOfDayGreeting() {
    var h = new Date().getHours();
    if (h < 12) return "morning";
    if (h < 18) return "afternoon";
    return "evening";
  }

  function pickVoice() {
    var voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
    var gb = voices.find(function (v) { return v.lang === "en-GB"; });
    return gb || voices.find(function (v) { return /en-GB/i.test(v.lang); }) || voices[0];
  }

  function speak(text) {
    if (!window.speechSynthesis || !text) return;
    var utter = new SpeechSynthesisUtterance(text);
    var voice = pickVoice();
    if (voice) utter.voice = voice;
    utter.lang = "en-GB";
    utter.rate = 1.0;
    utter.pitch = 1.0;
    window.speechSynthesis.speak(utter);
  }

  function bootSequence() {
    var fill = document.getElementById("boot-bar-fill");
    var status = document.getElementById("boot-status");
    var messages = [
      "Initializing agent mesh…",
      "Loading SUPER_AGENTS command tier…",
      "Connecting VOICE_AI channels…",
      "Syncing CONVERSATION_AI fleet…",
      "Establishing neural graph…",
      "All systems nominal."
    ];
    var pct = 0;
    var msgIdx = 0;
    var interval = setInterval(function () {
      pct += 4 + Math.random() * 10;
      if (pct >= 100) pct = 100;
      fill.style.width = pct + "%";
      var target = Math.floor((pct / 100) * (messages.length - 1));
      if (target !== msgIdx) {
        msgIdx = target;
        status.textContent = messages[msgIdx];
      }
      if (pct >= 100) {
        clearInterval(interval);
        status.textContent = messages[messages.length - 1];
        setTimeout(function () {
          document.getElementById("boot-overlay").classList.add("hidden");
          var greeting = "Good " + timeOfDayGreeting() + ", sir. " +
            GRAPH.nodes.length + " agents are online across the EMG-JARVIS fleet.";
          speak(greeting);
        }, 500);
      }
    }, 140);
  }

  if (window.speechSynthesis) {
    window.speechSynthesis.onvoiceschanged = function () {};
  }
  window.addEventListener("load", bootSequence);
  setTimeout(bootSequence, 2500);
  var bootStarted = false;
  var origBoot = bootSequence;
  bootSequence = function () {
    if (bootStarted) return;
    bootStarted = true;
    origBoot();
  };

  /* ============================================================
     Search
     ============================================================ */
  var searchInput = document.getElementById("search-input");
  searchInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      var q = searchInput.value.trim().toLowerCase();
      if (!q) return;
      var match = GRAPH.nodes.find(function (n) { return n.label.toLowerCase().indexOf(q) !== -1; });
      if (match) openAgent(match.id, true);
    }
  });

  /* ============================================================
     Side panel
     ============================================================ */
  var groupColors = { SUPER_AGENTS: "#C9A84C", VOICE_AI: "#00E5FF", CONVERSATION_AI: "#00C896" };
  var sidePanel = document.getElementById("side-panel");

  function openAgent(id, fly) {
    var node = nodeById(id) || GRAPH.nodes.find(function (n) { return n.id === id; });
    if (!node) return;

    var tag = document.getElementById("panel-group-tag");
    tag.textContent = node.group.replace("_", " ");
    var color = groupColors[node.group] || node.color || "#C9A84C";
    tag.style.background = color + "22";
    tag.style.color = color;
    tag.style.border = "1px solid " + color + "66";

    document.getElementById("panel-name").textContent = node.label;
    document.getElementById("panel-type").textContent = node.type;
    document.getElementById("panel-status").textContent = node.status;
    document.getElementById("panel-tools").textContent = node.tools;
    document.getElementById("panel-description").textContent = node.description;

    var list = document.getElementById("panel-linked-list");
    list.innerHTML = "";
    (node.linkedAgents || []).forEach(function (linkedId) {
      var linked = GRAPH.nodes.find(function (n) { return n.id === linkedId; });
      if (!linked) return;
      var li = document.createElement("li");
      var dotColor = groupColors[linked.group] || linked.color;
      li.innerHTML = '<i class="dot" style="background:' + dotColor + ';box-shadow:0 0 6px ' + dotColor + '"></i>' + linked.label;
      li.addEventListener("click", function () { openAgent(linked.id, true); });
      list.appendChild(li);
    });

    sidePanel.classList.add("open");
    if (fly) flyToNode(node, 1000);
  }

  document.getElementById("panel-close").addEventListener("click", function () {
    sidePanel.classList.remove("open");
  });

  /* ============================================================
     Chat bar
     ============================================================ */
  var chatInput = document.getElementById("chat-input");
  var chatAnswerBox = document.getElementById("chat-answer");
  var chatAnswerText = document.getElementById("chat-answer-text");
  var answerHideTimer = null;

  function firstSentence(text) {
    var m = text.match(/^.*?[.!?](\s|$)/);
    return m ? m[0].trim() : text;
  }

  function showAnswer(text) {
    chatAnswerText.textContent = text;
    chatAnswerBox.classList.add("visible");
    clearTimeout(answerHideTimer);
    answerHideTimer = setTimeout(function () {
      chatAnswerBox.classList.remove("visible");
    }, 20000);
  }

  function addGoldStarNode(label) {
    var newId = GRAPH.nodes.length ? Math.max.apply(null, GRAPH.nodes.map(function (n) { return n.id; })) + 1 : 0;
    var anchor = GRAPH.nodes.find(function (n) { return n.group === "SUPER_AGENTS"; });
    var node = {
      id: newId,
      label: label,
      group: "MEMORY",
      type: "memory-capture",
      status: "active",
      tools: 0,
      description: label,
      linkedAgents: anchor ? [anchor.id] : [],
      color: "#FFD700"
    };
    GRAPH.nodes.push(node);
    if (anchor) GRAPH.links.push({ source: newId, target: anchor.id });
    Graph.graphData(GRAPH);
    setTimeout(function () { flyToNode(nodeById(newId), 1200); }, 300);
  }

  function sendChat() {
    var text = chatInput.value.trim();
    if (!text) return;
    chatInput.value = "";

    if (/^remember\b/i.test(text)) {
      var payload = text.replace(/^remember\b[:,]?\s*/i, "");
      fetch("/remember", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: payload || text })
      })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var label = (data && data.label) || "New Memory";
          showAnswer("Noted, sir. Filed as “" + label + "”.");
          speak("Noted, sir.");
          addGoldStarNode(label);
        })
        .catch(function () {
          showAnswer("I couldn't save that memory, sir.");
        });
      return;
    }

    showAnswer("Thinking…");
    fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, session_id: SESSION_ID })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var answer = data.answer || "I have no response, sir.";
        showAnswer(answer);
        speak(firstSentence(answer));
        if (data.nodes && data.nodes.length) {
          lightUpCluster(data.nodes, true);
        }
      })
      .catch(function () {
        showAnswer("I couldn't reach the server, sir.");
      });
  }

  document.getElementById("send-btn").addEventListener("click", sendChat);
  chatInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") sendChat();
  });

  /* ============================================================
     Mic input (Web Speech API)
     ============================================================ */
  var micBtn = document.getElementById("mic-btn");
  var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recognition = null;
  var listening = false;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = "en-GB";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onresult = function (event) {
      var transcript = event.results[0][0].transcript;
      chatInput.value = transcript;
      sendChat();
    };
    recognition.onend = function () {
      listening = false;
      micBtn.classList.remove("listening");
    };
    recognition.onerror = function () {
      listening = false;
      micBtn.classList.remove("listening");
    };
  }

  micBtn.addEventListener("click", function () {
    if (!recognition) {
      showAnswer("Voice input isn't supported in this browser, sir.");
      return;
    }
    if (listening) {
      recognition.stop();
      return;
    }
    listening = true;
    micBtn.classList.add("listening");
    try {
      recognition.start();
    } catch (e) {
      listening = false;
      micBtn.classList.remove("listening");
    }
  });

  /* ============================================================
     Escape key closes panels
     ============================================================ */
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      sidePanel.classList.remove("open");
      chatAnswerBox.classList.remove("visible");
      if (recognition && listening) recognition.stop();
    }
  });

}());
</script>
</body>
</html>
